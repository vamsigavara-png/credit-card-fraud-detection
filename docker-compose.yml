version: '3.8'

services:
  fraud-detection:
    build: .
    container_name: credit-card-fraud-detection
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py --mode train --data data/creditcard.csv
    
  fraud-api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
    command: python api/app.py
    depends_on:
      - fraud-detection
